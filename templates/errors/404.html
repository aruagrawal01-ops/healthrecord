{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block page_title %}Page not found{% endblock %}
{% block content %}
<div class="card-x text-center py-5">
    <div class="display-1 fw-bold grad-text">404</div>
    <h2 class="h4 fw-bold">This page does not exist</h2>
    <p class="text-muted">The link may be old, or the record may have been removed.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Back to safety</a>
</div>
{% endblock %}
