{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Login as</label>
                        <select class="form-select" name="role" required>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="lab_assistant">Lab Assistant</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0 small text-muted">
                    New patient? <a href="{{ url_for('auth.register') }}">Register here</a>
                </p>
            </div>
        </div>
        <div class="card mt-3 demo-card">
            <div class="card-body small">
                <strong>Demo accounts</strong> (seed_data.sql)
                <ul class="mb-0 mt-2">
                    <li>Admin &mdash; <code>admin</code> / <code>admin123</code></li>
                    <li>Doctor &mdash; <code>drmehta</code> / <code>doctor123</code></li>
                    <li>Lab Assistant &mdash; <code>labtech</code> / <code>lab123</code></li>
                    <li>Patient &mdash; <code>rahul</code> / <code>patient123</code></li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
