{% extends "base.html" %}
{% block title %}Add Diagnosis{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-file-earmark-plus"></i> Add Diagnosis &mdash; {{ person.full_name }}</h3>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {% if open_appointments %}
            <div class="mb-3">
                <label class="form-label">Link to Appointment (optional)</label>
                <select class="form-select" name="appointment_id">
                    <option value="">— None —</option>
                    {% for a in open_appointments %}
                    <option value="{{ a.appointment_id }}">{{ a.appointment_date }} at {{ a.appointment_time }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Diagnosis</label>
                <textarea class="form-control" name="diagnosis" rows="2" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Prescription</label>
                <textarea class="form-control" name="prescription" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Record</button>
            <a href="{{ url_for('doctor.patient_detail', patient_id=person.patient_id) }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
