{% extends "base.html" %}
{% block title %}Patients{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-people"></i> Patients</h3>

<form method="GET" class="mb-3 d-flex gap-2">
    <input type="text" class="form-control" name="q" placeholder="Search by name..." value="{{ search }}">
    <button class="btn btn-primary">Search</button>
</form>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>Name</th><th>Gender</th><th>Blood Group</th><th>Phone</th><th></th></tr></thead>
            <tbody>
                {% for p in patients %}
                <tr>
                    <td>{{ p.full_name }}</td>
                    <td>{{ p.gender }}</td>
                    <td>{{ p.blood_group or '—' }}</td>
                    <td>{{ p.phone or '—' }}</td>
                    <td><a href="{{ url_for('doctor.patient_detail', patient_id=p.patient_id) }}" class="btn btn-sm btn-outline-primary">View Record</a></td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="text-muted text-center py-3">No patients found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
