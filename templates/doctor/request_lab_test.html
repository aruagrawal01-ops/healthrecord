{% extends "base.html" %}
{% block title %}Request Lab Test{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-flask"></i> Request Lab Test &mdash; {{ person.full_name }}</h3>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Test Name</label>
                <input type="text" class="form-control" name="test_name" placeholder="e.g. Complete Blood Count" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Request</button>
            <a href="{{ url_for('doctor.patient_detail', patient_id=person.patient_id) }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
