<div class="modal fade" id="resetPw" tabindex="-1" aria-labelledby="resetPwTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content border-0" method="POST" style="border-radius:20px" id="resetForm">
            <div class="modal-header border-0"><h5 class="modal-title fw-bold" id="resetPwTitle">Reset password for <span data-reset-label></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body">
                <input type="hidden" name="back" value="{{ request.full_path }}">
                <label class="form-label" for="new_password">New password</label>
                <div class="input-group">
                    <input type="text" class="form-control mono" id="new_password" name="new_password" minlength="6" required>
                    <button type="button" class="btn btn-ghost" id="genPw"><i class="bi bi-shuffle"></i> Generate</button>
                </div>
                <div class="small text-muted mt-2">The password is hashed (scrypt) before it is stored. Share it with the user securely.</div>
            </div>
            <div class="modal-footer border-0"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Reset password</button></div>
        </form>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("resetPw"), form = document.getElementById("resetForm");
    modal.addEventListener("show.bs.modal", (e) => {
        form.action = "{{ url_for('admin.reset_password', user_id=0) }}".replace("/0/", "/" + e.relatedTarget.dataset.user + "/");
        modal.querySelector("[data-reset-label]").textContent = e.relatedTarget.dataset.label;
        form.new_password.value = "";
    });
    document.getElementById("genPw").addEventListener("click", () => {
        const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789", a = new Uint32Array(10);
        crypto.getRandomValues(a);
        form.new_password.value = Array.from(a, (n) => chars[n % chars.length]).join("");
    });
});
</script>
