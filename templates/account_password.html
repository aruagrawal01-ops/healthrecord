{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block crumb %}Account{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card-x">
            <div class="card-head"><h2><span class="icon-chip"><i class="bi bi-key"></i></span>Update your password</h2></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label class="form-label" for="current_password">Current password</label><input type="password" class="form-control" id="current_password" name="current_password" required autocomplete="current-password"></div>
                    <div class="mb-3"><label class="form-label" for="new_password">New password</label><input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required autocomplete="new-password"></div>
                    <div class="mb-4"><label class="form-label" for="confirm_password">Confirm new password</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required autocomplete="new-password"></div>
                    <button class="btn btn-primary">Save password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
